name: Continuous Delivery
on:
  push:
    branches:
      - develop
jobs:
  backend:
    name: Deploy Petcare Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image - Backend
        run: |
          docker build --target prod -t ${{ secrets.DOCKER_USERNAME }}/petcare-backend:develop ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/petcare-backend:develop

  frontend:
    name: Deploy Petcare Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image - Frontend
        run: |
          docker build --target prod -t ${{ secrets.DOCKER_USERNAME }}/petcare-frontend:develop ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/petcare-frontend:develop