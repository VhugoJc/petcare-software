name: Continuous Integration
on:
  push:
    branches:
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop
jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json
      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint

      - name: Typecheck Backend
        working-directory: ./backend
        run: npm run typecheck

      - name: Build Backend
        working-directory: ./backend
        run: npm run build
        
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
      
